name: CI

# The same commands CONTRIBUTING.md lists. No live-model evals, no deploys (ADR-0017).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The CDK stack tests and `cdk synth` stage web/dist as an asset.
      - name: Build SPA
        run: pnpm build:web

      - name: Unit tests
        run: pnpm test

      - name: Intake evals (deterministic)
        run: pnpm evals:intake

      - name: cdk synth
        run: pnpm cdk synth

      - name: Cloudflare Worker bundle (dry run)
        run: pnpm cf:check
