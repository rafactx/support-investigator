name: CI

# The same commands CONTRIBUTING.md lists. No live-model evals, no deploys (ADR-0017, ADR-0049).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded pull request runs are cancelled; every run on main finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The CDK stack tests, `cdk synth` and the Worker bundle all read web/dist.
      - name: Build SPA
        run: pnpm build:web

      - name: Unit tests
        run: pnpm test

      - name: Intake evals (deterministic)
        run: pnpm evals:intake

      - name: cdk synth
        run: pnpm cdk synth

      - name: Cloudflare Worker bundle (dry run)
        run: pnpm cf:check
